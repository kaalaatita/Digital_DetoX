name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Android wrapper tools
        run: pnpm add -D @capacitor/cli@7 && pnpm add @capacitor/core@7 @capacitor/android@7

      - name: Build static web app
        run: pnpm build

      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then pnpm exec cap add android; fi
          pnpm exec cap sync android

      - name: Assemble installable APK
        run: cd android && ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-detox-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
